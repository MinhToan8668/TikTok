<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tạo nền Teams — Tự Mình Xây Kênh</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cg%20transform%3D%22rotate%28-9%2032%2017%29%22%3E%3Crect%20x%3D%2219%22%20y%3D%2211%22%20width%3D%2226%22%20height%3D%2212%22%20rx%3D%223%22%20fill%3D%22%2399df00%22/%3E%3Cpath%20d%3D%22M30%2014.4v5.2a1%201%200%200%200%201.52.86l4.6-2.6a1%201%200%200%200%200-1.72l-4.6-2.6A1%201%200%200%200%2030%2014.4z%22%20fill%3D%22%2326210f%22/%3E%3C/g%3E%3Crect%20x%3D%2219%22%20y%3D%2228%22%20width%3D%2226%22%20height%3D%2212%22%20rx%3D%223%22%20fill%3D%22%2326210f%22/%3E%3Crect%20x%3D%224%22%20%20y%3D%2244%22%20width%3D%2226%22%20height%3D%2212%22%20rx%3D%223%22%20fill%3D%22%2326210f%22/%3E%3Crect%20x%3D%2234%22%20y%3D%2244%22%20width%3D%2226%22%20height%3D%2212%22%20rx%3D%223%22%20fill%3D%22%2326210f%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f9e8dd;--lime:#99df00;--ink:#26210f;--moss:#1b220d}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--paper);
       color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{width:min(760px,100%);background:#fff;border:1.5px solid rgba(38,33,15,.14);
        border-radius:20px;padding:26px;box-shadow:0 14px 40px rgba(38,33,15,.10)}
  h1{font-size:22px;font-weight:800;margin:0 0 4px}
  p.sub{margin:0 0 18px;font-size:14px;opacity:.65}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  input[type=text],select{flex:1;min-width:170px;font:inherit;font-size:17px;font-weight:500;
    padding:12px 14px;border:1.5px solid rgba(38,33,15,.22);border-radius:12px;background:var(--paper);
    color:var(--ink)}
  select{flex:0 1 190px;cursor:pointer}
  input[type=text]:focus,select:focus{outline:2px solid var(--lime);border-color:transparent}
  [hidden]{display:none}
  .seg{display:flex;border:1.5px solid rgba(38,33,15,.22);border-radius:12px;overflow:hidden}
  .seg button{font:inherit;font-size:14px;font-weight:800;padding:12px 16px;border:0;
    background:#fff;color:var(--ink);cursor:pointer}
  .seg button.on{background:var(--ink);color:var(--lime)}
  canvas{width:100%;border-radius:12px;border:1.5px solid rgba(38,33,15,.14);display:block}
  .dl{margin-top:14px;width:100%;font:inherit;font-size:16px;font-weight:800;padding:14px;
    border:0;border-radius:12px;background:var(--lime);color:var(--ink);cursor:pointer}
  .dl:hover{filter:brightness(1.05)}
</style>
</head>
<body>
<div class="card">
  <h1>Tạo nền gọi MS Teams</h1>
  <p class="sub">Điền tên, chọn vai trò và kiểu nền → bấm tải. Ảnh xuất ra 1920×1080.</p>
  <div class="row">
    <input id="ten" type="text" value="Minh Toàn" maxlength="30" placeholder="Tên người trên nền">
    <select id="vai" aria-label="Vai trò">
      <option value="MENTOR">Mentor</option>
      <option value="TRỢ LÝ">Trợ lý</option>
      <option value="GIẢNG VIÊN">Giảng viên</option>
      <option value="TRỢ GIẢNG">Trợ giảng</option>
      <option value="__khac">Vai trò khác…</option>
      <option value="">Không hiện vai trò</option>
    </select>
    <input id="vaiKhac" type="text" maxlength="16" placeholder="Vai trò tự ghi" hidden>
  </div>
  <div class="row">
    <div class="seg">
      <button id="bSang" class="on" type="button">☀️ Sáng</button>
      <button id="bToi" type="button">🌙 Tối</button>
      <button id="bLime" type="button">🟩 Lime kẻ lưới</button>
    </div>
  </div>
  <canvas id="cv" width="1920" height="1080"></canvas>
  <button class="dl" id="tai" type="button">⬇️ Tải nền PNG</button>
</div>

<script>
var LIME='#99df00', PAPER='#f9e8dd', INK='#26210f', MOSS='#1b220d';
var TEN_KENH='Tự Mình Xây Kênh';
var kieu='sang';                                  // sang | toi | lime
var cv=document.getElementById('cv'), cx=cv.getContext('2d');

function ro(x,y,w,h,r){ // rounded rect
  cx.beginPath();
  cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r);
  cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); cx.fill();
}

/* Chồng gạch: gốc hệ 64x45, scale s, đặt tại (px,py) */
function veMark(px,py,s,brick,play,dot){
  cx.save(); cx.translate(px,py); cx.scale(s,s);
  cx.save();                                  // viên lime xoay -9°
  cx.translate(32,17); cx.rotate(-9*Math.PI/180); cx.translate(-32,-17);
  cx.fillStyle=play; ro(19,11,26,12,3);
  cx.fillStyle=dot;
  cx.beginPath(); cx.moveTo(30,14.4); cx.lineTo(30,19.6); cx.lineTo(36.6,17); cx.closePath(); cx.fill();
  cx.restore();
  cx.fillStyle=brick; ro(19,28,26,12,3); ro(4,44,26,12,3); ro(34,44,26,12,3);
  cx.restore();
}

/* Lưới y như landing page: ô 184×92, đường mực #1c2600 1.5px, mờ 9%, tan dần ở giữa khung */
function veLuoi(){
  var lc=document.createElement('canvas'); lc.width=1920; lc.height=1080;
  var lx=lc.getContext('2d'), i;
  lx.fillStyle='#1c2600';
  for(i=0;i<1080;i+=92)  lx.fillRect(0,i,1920,1.5);
  for(i=0;i<1920;i+=184) lx.fillRect(i,0,1.5,1080);

  lx.globalCompositeOperation='destination-in';   // mặt nạ ellipse: giữa trống, ra rìa mới hiện lưới
  lx.translate(960,486); lx.scale(1,626.4/1190.4);
  var m=lx.createRadialGradient(0,0,0,0,0,1190.4);
  m.addColorStop(0,  'rgba(0,0,0,0)');
  m.addColorStop(.38,'rgba(0,0,0,0)');
  m.addColorStop(.72,'rgba(0,0,0,.55)');
  m.addColorStop(1,  'rgba(0,0,0,1)');
  lx.fillStyle=m; lx.fillRect(-2400,-2400,4800,4800);

  cx.save(); cx.globalAlpha=.09; cx.filter='blur(.6px)';
  cx.drawImage(lc,0,0); cx.restore();
}

/* Lockup chuẩn, số đo lấy từ assets/brand/tmxk-lockup.svg (hệ 387×72):
   gạch đặt tại (6,4), chữ bắt đầu x=84.6, chân chữ y=47, cao cap-height 22.44.
   Trả về mép phải của lockup để còn chừa chỗ cho tên mentor. */
function veLockup(px,py,s,brick,play,dot,chu){
  cx.save(); cx.translate(px,py); cx.scale(s,s);
  veMark(6,4,1,brick,play,dot);
  cx.font='800 100px "Bricolage Grotesque",sans-serif';
  var cap=cx.measureText('H').actualBoundingBoxAscent||72;   // cap-height ứng với cỡ 100
  cx.font='800 '+(2244/cap).toFixed(2)+'px "Bricolage Grotesque",sans-serif';
  cx.fillStyle=chu; cx.textBaseline='alphabetic';
  var w=cx.measureText(TEN_KENH).width;
  cx.fillText(TEN_KENH,84.6,47);
  cx.restore();
  return px+(84.6+w)*s;
}

/* Chữ căn phải, trả về bề rộng để vẽ gạch chân */
function chuPhai(t,x,y){
  var w=cx.measureText(t).width;
  cx.fillText(t,x-w,y);
  return w;
}

/* Nhãn vai trò: chữ nhỏ giãn ô, căn mép phải. Để trống thì không vẽ gì.
   Cộng bù 7px vì letterSpacing thừa một khoảng sau chữ cuối. */
function veNhan(vai,x,y,mau){
  if(!vai) return;
  cx.fillStyle=mau; cx.textBaseline='alphabetic';
  cx.font='800 24px "Bricolage Grotesque",sans-serif';
  cx.letterSpacing='7px';
  chuPhai(vai,x+7,y);
  cx.letterSpacing='0px';
}

/* Nền sáng / tối: logo vừa, tên cùng hàng bên phải */
function veCoBan(ten,vai){
  var toi  = kieu==='toi';
  var bg   = toi ? MOSS  : PAPER;
  var chu  = toi ? '#f7f2e9' : INK;
  var brick= toi ? '#f4efe6' : INK;
  var dot  = toi ? MOSS  : INK;

  cx.fillStyle=bg; cx.fillRect(0,0,1920,1080);
  veMark(84,76,2.05,brick,LIME,dot);

  cx.fillStyle=chu; cx.textBaseline='alphabetic';
  cx.font='800 78px "Bricolage Grotesque",sans-serif';
  cx.fillText('Tự Mình Xây Kênh',300,184);

  veNhan(vai,1832,76, toi ? 'rgba(247,242,233,.62)' : 'rgba(38,33,15,.58)');

  cx.fillStyle=chu;
  cx.font='800 100px "Bricolage Grotesque",sans-serif';
  var w=cx.measureText(ten).width, x=1832-w;
  cx.fillText(ten,x,168);
  cx.fillStyle=LIME; ro(x,200,w,12,6);        // gạch chân lime dưới tên
  ro(0,1058,1920,22,0);                       // vạch lime đáy khung
}

/* Nền lime kẻ lưới: dịu mắt, logo to góc trái, tên mentor góc phải trên */
function veLime(ten,vai){
  var DONG=184, TRAI=184, PHAI=1840, s=2.4;   // chân chữ và hai mép đều nằm trên đường lưới

  cx.fillStyle=LIME; cx.fillRect(0,0,1920,1080);
  veLuoi();

  var mep=veLockup(TRAI-10*s,DONG-47*s,s,INK,PAPER,INK,INK);

  veNhan(vai,PHAI,DONG-84,'rgba(38,33,15,.58)');

  cx.fillStyle=INK;                           // tên dài thì co lại, không đè vào lockup
  var co=72, rong=PHAI-mep-120;
  cx.font='800 '+co+'px "Bricolage Grotesque",sans-serif';
  while(cx.measureText(ten).width>rong && co>44){
    co-=4; cx.font='800 '+co+'px "Bricolage Grotesque",sans-serif';
  }
  chuPhai(ten,PHAI,DONG);
  ro(PHAI-132,DONG+30,132,7,4);               // gạch chân ngắn, căn mép phải

  cx.fillStyle='rgba(38,33,15,.85)'; ro(0,1070,1920,10,0);   // vạch mực mảnh đáy khung
}

/* Vai trò: chọn sẵn trong danh sách, hoặc tự ghi khi chọn "Vai trò khác…" */
function layVai(){
  var o=document.getElementById('vai'), k=document.getElementById('vaiKhac'), v=o.value;
  k.hidden = v!=='__khac';
  if(v==='__khac') v=k.value||'';
  return v.trim().toUpperCase();
}

function ve(){
  var ten=(document.getElementById('ten').value||'').trim()||' ', vai=layVai();
  if(kieu==='lime') veLime(ten,vai); else veCoBan(ten,vai);
}

function veKhiSanFont(){
  var f1=document.fonts.load('800 100px "Bricolage Grotesque"');
  var f2=document.fonts.load('800 78px "Bricolage Grotesque"');
  var f3=document.fonts.load('800 58px "Bricolage Grotesque"');
  var f4=document.fonts.load('800 92px "Bricolage Grotesque"');
  Promise.all([f1,f2,f3,f4]).then(ve).catch(ve);
}

document.getElementById('ten').addEventListener('input',ve);
document.getElementById('vai').addEventListener('change',ve);
document.getElementById('vaiKhac').addEventListener('input',ve);
document.getElementById('bSang').onclick=function(){kieu='sang';chon(this);ve()};
document.getElementById('bToi').onclick =function(){kieu='toi'; chon(this);ve()};
document.getElementById('bLime').onclick=function(){kieu='lime';chon(this);ve()};
function chon(b){
  document.querySelectorAll('.seg button').forEach(function(x){x.classList.remove('on')});
  b.classList.add('on');
}
document.getElementById('tai').onclick=function(){
  ve();
  var ten=(document.getElementById('ten').value||'nen').trim()
    .normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D')
    .replace(/[^\w]+/g,'-').toLowerCase();
  var a=document.createElement('a');
  a.download='nen-teams-'+ten+'-'+kieu+'.png';
  a.href=cv.toDataURL('image/png');
  a.click();
};

veKhiSanFont();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(ve);
</script>
</body>
</html>
