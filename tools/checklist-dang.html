<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist trước khi đăng · Tự Mình Xây Kênh</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cg%20transform%3D%22rotate%28-9%2032%2017%29%22%3E%3Crect%20x%3D%2219%22%20y%3D%2211%22%20width%3D%2226%22%20height%3D%2212%22%20rx%3D%223%22%20fill%3D%22%2399df00%22/%3E%3Cpath%20d%3D%22M30%2014.4v5.2a1%201%200%200%200%201.52.86l4.6-2.6a1%201%200%200%200%200-1.72l-4.6-2.6A1%201%200%200%200%2030%2014.4z%22%20fill%3D%22%2326210f%22/%3E%3C/g%3E%3Crect%20x%3D%2219%22%20y%3D%2228%22%20width%3D%2226%22%20height%3D%2212%22%20rx%3D%223%22%20fill%3D%22%2326210f%22/%3E%3Crect%20x%3D%224%22%20y%3D%2244%22%20width%3D%2226%22%20height%3D%2212%22%20rx%3D%223%22%20fill%3D%22%2326210f%22/%3E%3Crect%20x%3D%2234%22%20y%3D%2244%22%20width%3D%2226%22%20height%3D%2212%22%20rx%3D%223%22%20fill%3D%22%2326210f%22/%3E%3C/svg%3E">
<meta name="description" content="Tick từng mục trước khi bấm đăng TikTok hay Reels: video có nguyên bản không, có bị bóp từ đầu không, và làm gì trong giờ đầu sau khi đăng.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#99DF00; --surface:#FDFBF3; --surface-2:#F1F6E0; --line:#C9DE93; --line-strong:#5F8C00;
    --text:#1C2600; --muted:#57612F; --accent:#99DF00; --accent-ink:#1C2600; --accent-soft:#E6F6BC;
    --pro:#26210F; --pro-text:#F9E8DD; --danger:#B4432A; --warn:#B8860B; --ok:#3E7D1F;
    --radius:14px; --shadow:0 10px 30px rgba(38,33,15,.10);
    --font-ui:'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-display:'Bricolage Grotesque', 'Be Vietnam Pro', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0B0C08; --surface:#15170F; --surface-2:#1E2114; --line:#4E6E10; --line-strong:#99DF00;
      --text:#F3F0E4; --muted:#B7B89A; --accent:#99DF00; --accent-ink:#0B0C08; --accent-soft:#233207;
      --pro:#99DF00; --pro-text:#1B220D; --danger:#E0795F; --warn:#E3B341; --ok:#8FD15A; --shadow:0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0B0C08; --surface:#15170F; --surface-2:#1E2114; --line:#4E6E10; --line-strong:#99DF00;
    --text:#F3F0E4; --muted:#B7B89A; --accent:#99DF00; --accent-ink:#0B0C08; --accent-soft:#233207;
    --pro:#99DF00; --pro-text:#1B220D; --danger:#E0795F; --warn:#E3B341; --ok:#8FD15A; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:15px;line-height:1.5}
  .wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
  .tmxk-logo{width:38px;height:38px;flex:none}
  .tmxk-logo .ink{fill:var(--text)}
  .brand b{display:block;font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1.1}
  .brand small{color:var(--muted);font-size:12px}
  .theme-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;font-size:16px;flex:none}

  .wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-block:14px 0}

  /* thanh bước: mỗi bước một vạch, bấm để nhảy */
  .cac-buoc{display:flex;gap:6px;margin-bottom:12px}
  .cac-buoc button{flex:1;height:30px;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:center}
  .cac-buoc button::before{content:"";display:block;width:100%;height:8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);transition:background .2s}
  .cac-buoc button.xong::before{background:var(--line-strong);border-color:var(--line-strong)}
  .cac-buoc button[aria-current="step"]::before{background:var(--text);border-color:var(--text);height:10px}
  .cac-buoc button:focus-visible{outline:3px solid var(--line-strong);outline-offset:2px;border-radius:6px}

  .man{flex:1;display:flex;flex-direction:column}
  .the{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
  .the .so{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between}
  .the .so .xong{color:var(--ok)}
  .the h2{font-family:var(--font-display);font-weight:800;font-size:clamp(22px,6vw,28px);line-height:1.1;margin:4px 0 6px;letter-spacing:-.02em;outline:none}
  .the > p{margin:0 0 12px;color:var(--muted);font-size:13.5px}

  ul.muc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .muc label{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:10px;border-radius:12px;cursor:pointer;background:var(--surface-2);border:1px solid transparent;transition:border-color .15s}
  .muc label:hover{border-color:var(--line)}
  .muc input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:2px solid var(--line-strong);border-radius:7px;background:var(--surface);cursor:pointer;display:grid;place-items:center}
  .muc input::after{content:"";width:12px;height:7px;border:3px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
  .muc input:checked{background:var(--accent);border-color:var(--accent)}
  .muc input:checked::after{opacity:1}
  .muc input:focus-visible{outline:3px solid var(--line-strong);outline-offset:2px}
  .muc .nd b{display:block;font-weight:700;font-size:14.5px}
  .muc .nd > span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
  .muc input:checked + .nd b{text-decoration:line-through;text-decoration-color:var(--line-strong);opacity:.7}
  .tag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px;background:var(--danger);color:var(--surface);text-decoration:none}

  /* nút dưới cùng luôn trong tầm ngón cái */
  .dieu-huong{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 0 calc(12px + env(safe-area-inset-bottom));margin-top:auto;background:linear-gradient(transparent,var(--bg) 30%)}
  .dieu-huong button,.nut a,.nut button{min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:800;font-size:15px;border-radius:14px;padding:10px 14px;text-decoration:none;cursor:pointer;border:2px solid var(--text);background:var(--surface);color:var(--text)}
  .dieu-huong .lui{flex:0 0 auto;width:58px}
  .dieu-huong .tiep,.nut a.chinh{flex:1;background:var(--text);color:var(--accent)}
  .dieu-huong button:disabled{display:none}
  :root[data-theme="dark"] .dieu-huong button,:root[data-theme="dark"] .nut a,:root[data-theme="dark"] .nut button{border-color:var(--accent)}
  :root[data-theme="dark"] .dieu-huong .tiep,:root[data-theme="dark"] .nut a.chinh{background:var(--accent);color:var(--accent-ink)}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .dieu-huong button,:root:not([data-theme="light"]) .nut a,:root:not([data-theme="light"]) .nut button{border-color:var(--accent)}
    :root:not([data-theme="light"]) .dieu-huong .tiep,:root:not([data-theme="light"]) .nut a.chinh{background:var(--accent);color:var(--accent-ink)}
  }

  /* màn kết quả */
  .ket-qua .lon{font-size:44px;line-height:1;margin-bottom:6px}
  .thieu{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
  .thieu button{width:100%;text-align:left;font:inherit;font-size:14px;font-weight:600;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:center}
  .thieu button::after{content:"›";margin-left:auto;font-size:20px;color:var(--muted)}
  details.canh-bao{margin-top:12px;border:1px dashed var(--line-strong);border-radius:14px;padding:12px 14px;background:var(--surface-2)}
  .canh-bao summary{font-weight:800;cursor:pointer;min-height:24px}
  .canh-bao ul{margin:8px 0 0;padding-left:18px;font-size:13.5px;color:var(--muted)}
  .canh-bao li{margin-bottom:4px}
  .canh-bao li b{color:var(--text)}
  .nut{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .nguon{font-size:12px;color:var(--muted);margin:12px 0 0}
  .nguon a{color:inherit}
  @media (prefers-reduced-motion: reduce){.cac-buoc button::before{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="../index.html" aria-label="Tự Mình Xây Kênh, về trang chủ">
      <svg class="tmxk-logo" viewBox="0 0 64 64" aria-hidden="true"><g transform="rotate(-9 32 17)"><rect x="19" y="11" width="26" height="12" rx="3" fill="#99df00"/><path d="M30 14.4v5.2a1 1 0 0 0 1.52.86l4.6-2.6a1 1 0 0 0 0-1.72l-4.6-2.6A1 1 0 0 0 30 14.4z" fill="#26210f"/></g><rect class="ink" x="19" y="28" width="26" height="12" rx="3"/><rect class="ink" x="4" y="44" width="26" height="12" rx="3"/><rect class="ink" x="34" y="44" width="26" height="12" rx="3"/></svg>
      <div><b>Checklist trước khi đăng</b><small>Tự Mình Xây Kênh</small></div>
    </a>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Đổi giao diện sáng hoặc tối">◐</button>
  </header>

  <nav class="cac-buoc" id="cacBuoc" aria-label="Các bước"></nav>
  <main class="man" id="man" aria-live="polite"></main>

  <div class="dieu-huong">
    <button class="lui" id="lui" type="button" aria-label="Quay lại bước trước">←</button>
    <button class="tiep" id="tiep" type="button">Tiếp →</button>
  </div>
</div>

<script>
// mỗi mục: [mã, tiêu đề, giải thích, quan trọng?]; mã giữ cố định để tick đã lưu không lệch khi sửa chữ
const NHOM = [
  { ma: 'nb', ten: 'Video là của bạn', mo: 'Nền tảng coi là nguyên bản khi bạn tự làm ra, hoặc bạn xuất hiện và thêm góc nhìn mới.', muc: [
    ['tu_quay', 'Tự quay, hoặc có mặt / giọng / tay của bạn', 'Đây là tín hiệu nguyên bản mạnh nhất.', true],
    ['goc_nhin', 'Tư liệu người khác chỉ là phụ', 'Nếu có chèn, phần chính vẫn là lời phân tích, bình luận hay câu chuyện của bạn.', true],
    ['khong_wm', 'Không còn logo, watermark nền tảng khác', 'TikTok, CapCut, Douyin, Reels… Video có watermark khác thường không được đề xuất.', true],
    ['nhac_tv', 'Nhạc lấy từ thư viện của nền tảng', 'Không tách nhạc từ video người khác: dễ bị tắt tiếng hoặc chặn.', false]
  ]},
  { ma: 'xuat', ten: 'File xuất ra', mo: 'Hình vỡ, tiếng rè làm người xem lướt đi trước khi kịp xem nội dung.', muc: [
    ['khung_doc', 'Dọc 9:16, 1080×1920, 30 khung hình/giây', 'Đủ nét cho TikTok và Reels, file không quá nặng.', false],
    ['file_goc', 'Đăng file gốc vừa xuất', 'Không dùng file tải về từ nền tảng khác hay file đã nén lại nhiều lần.', true],
    ['nghe_ro', 'Mở lên xem lại một lượt bằng điện thoại', 'Giọng nghe rõ hơn nhạc, chữ không bị che bởi nút của app.', false]
  ]},
  { ma: 'nd', ten: 'Nội dung qua được vòng thử', mo: 'TikTok chấm theo hành vi người xem: xem hết, xem lại, bình luận, chia sẻ, lưu.', muc: [
    ['hook', '3 giây đầu khiến người ta dừng lướt', 'Không mở bằng "Chào mọi người, hôm nay mình…". Vào thẳng cảnh hay nhất hoặc câu gây tò mò.', true],
    ['chu_hook', 'Có chữ hook to, đọc được khi tắt tiếng', 'Đặt ở 1/3 trên, 1–2 dòng.', false],
    ['khong_cho_chet', 'Cắt hết khoảng chết', 'Không có đoạn nào trên 3 giây mà người xem không thấy gì mới.', false],
    ['ly_do_tuong_tac', 'Có lý do để bình luận, lưu hoặc chia sẻ', 'Một câu hỏi, một mẹo đáng lưu, hoặc một quan điểm để người xem phản hồi.', false]
  ]},
  { ma: 'dang', ten: 'Lúc bấm đăng', mo: 'Thuật toán đọc caption, chữ trên video và lời nói để hiểu video nói về gì, phát cho ai.', muc: [
    ['tu_khoa', 'Caption có từ khoá người ta hay tìm', 'Ví dụ "cá kho tộ", "nấu cơm nhanh" thay vì chỉ có emoji.', false],
    ['dung_chu_de', 'Đúng chủ đề kênh đang đi', 'Mỗi kênh một chủ đề, nhất là 10–20 video đầu.', false],
    ['dang_mot_lan', 'Chỉ đăng một lần', 'Không xoá đi đăng lại cùng video: dễ bị coi là trùng lặp.', true],
    ['tk_sach', 'Tài khoản không mua follow, tim, view', 'Tương tác ảo làm hỏng tín hiệu của cả kênh.', true]
  ]},
  { ma: 'sau', ten: 'Giờ đầu sau khi đăng', mo: 'Video vừa đăng có thể còn đang được duyệt, chưa lên For You ngay. Đó là bình thường.', muc: [
    ['tra_loi', 'Trả lời bình luận sớm', 'Ghim một bình luận gợi mở để kéo thêm người tham gia.', false],
    ['khong_xoa', 'Không xoá dù view đầu thấp', 'Giữ video lại, đọc số liệu để làm video sau tốt hơn.', false],
    ['xem_so', 'Hẹn sau 24 giờ xem Analytics', 'Nhìn tỉ lệ xem hết và giây người xem rời đi, không chỉ nhìn view.', false]
  ]}
];

const KEY = 'tmxk_checklist';
const KET = NHOM.length;          // chỉ số màn kết quả, sau nhóm cuối
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function docDaTick() {
  try { const v = JSON.parse(ls.get(KEY) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
}
let daTick = new Set(docDaTick());
let buoc = 0;

const $ = s => document.querySelector(s);
const tao = (tag, cls, text) => { const el = document.createElement(tag); if (cls) el.className = cls; if (text != null) el.textContent = text; return el; };
const idsNhom = n => n.muc.map(m => n.ma + '.' + m[0]);
const xongNhom = n => idsNhom(n).every(id => daTick.has(id));

// bước nằm trên hash (#b1…#b6) để nút Back của điện thoại quay lại bước trước
function buocTuHash() {
  const m = /^#b(\d)$/.exec(location.hash);
  const i = m ? Number(m[1]) - 1 : 0;
  return i >= 0 && i <= KET ? i : 0;
}
function di(i) {
  if (i === buoc) return;
  location.hash = 'b' + (i + 1);
}

function veThanhBuoc() {
  const nav = $('#cacBuoc');
  nav.replaceChildren();
  [...NHOM, { ten: 'Kết quả' }].forEach((n, i) => {
    const b = tao('button');
    b.type = 'button';
    b.setAttribute('aria-label', 'Bước ' + (i + 1) + ': ' + n.ten);
    if (i < KET && xongNhom(n)) b.classList.add('xong');
    if (i === buoc) b.setAttribute('aria-current', 'step');
    b.addEventListener('click', () => di(i));
    nav.append(b);
  });
}

function veNhom(n, i) {
  const the = tao('section', 'the');
  const ids = idsNhom(n);
  const so = tao('div', 'so');
  so.append(tao('span', null, 'Bước ' + (i + 1) + '/' + KET));
  const dem = tao('span', null, ids.filter(id => daTick.has(id)).length + '/' + ids.length + ' đã tick');
  if (xongNhom(n)) dem.className = 'xong';
  so.append(dem);
  const h = tao('h2', null, n.ten); h.tabIndex = -1;
  const ul = tao('ul', 'muc');
  n.muc.forEach(([ma, td, gt, quanTrong]) => {
    const id = n.ma + '.' + ma;
    const li = tao('li'); const lb = tao('label');
    const cb = tao('input'); cb.type = 'checkbox'; cb.dataset.id = id; cb.checked = daTick.has(id);
    const nd = tao('span', 'nd'); const b = tao('b', null, td);
    if (quanTrong) b.append(tao('span', 'tag', 'quan trọng'));
    nd.append(b, tao('span', null, gt));
    lb.append(cb, nd); li.append(lb); ul.append(li);
  });
  the.append(so, h, tao('p', null, n.mo), ul);
  return the;
}

function veKetQua() {
  const the = tao('section', 'the ket-qua');
  const thieu = [];
  NHOM.forEach((n, i) => n.muc.forEach(([ma, td, , quanTrong]) => {
    if (!daTick.has(n.ma + '.' + ma)) thieu.push({ i, td, quanTrong });
  }));
  thieu.sort((a, b) => (b.quanTrong ? 1 : 0) - (a.quanTrong ? 1 : 0));
  const h = tao('h2'); h.tabIndex = -1;
  if (!thieu.length) {
    the.append(tao('div', 'lon', '✅'));
    h.textContent = 'Sẵn sàng đăng';
    the.append(h, tao('p', null, 'Đăng xong đừng xoá đi đăng lại. Sau 24 giờ mở Analytics xem người xem rời đi ở giây thứ mấy, video sau sửa đúng chỗ đó.'));
  } else {
    the.append(tao('div', 'lon', thieu.some(t => t.quanTrong) ? '🛑' : '👀'));
    h.textContent = 'Còn ' + thieu.length + ' mục chưa tick';
    the.append(h, tao('p', null, 'Chạm vào từng mục để quay lại bước đó. Mục đỏ nên làm xong rồi mới đăng.'));
    const ul = tao('ul', 'thieu');
    thieu.forEach(t => {
      const li = tao('li'); const b = tao('button', null, t.td);
      b.type = 'button';
      if (t.quanTrong) b.append(tao('span', 'tag', 'quan trọng'));
      b.addEventListener('click', () => di(t.i));
      li.append(b); ul.append(li);
    });
    the.append(ul);
  }

  const cb = tao('details', 'canh-bao');
  cb.append(tao('summary', null, '⚠️ Đừng tin mấy chiêu này'));
  const ul = tao('ul');
  [
    ['Chèn mã, hash, file "đặc biệt" vào video.', ' Nền tảng nén lại video và tự tính dấu vân tay từ hình và tiếng, nên dữ liệu bạn nhét vào không còn lại gì.'],
    ['Lật hình, zoom, đổi tốc độ, thêm viền để reup.', ' Facebook ghi rõ đây là chỉnh sửa giá trị thấp và giảm phân phối, TikTok cũng nhận ra.'],
    ['Mua view, mua tim, dùng tool buff.', ' Bị coi là thao túng nền tảng, nặng thì khoá kênh.'],
    ['"Video nào cũng được 200–500 view đầu", "có giờ vàng chung".', ' Nền tảng không công bố con số này. Giờ đăng hợp lý xem trong Analytics của chính kênh bạn.']
  ].forEach(([dam, thuong]) => { const li = tao('li'); li.append(tao('b', null, dam), thuong); ul.append(li); });
  cb.append(ul);

  const nut = tao('div', 'nut');
  const a1 = tao('a', 'chinh', '🎯 Chấm video trước khi đăng'); a1.href = 'cham-video.html';
  const a2 = tao('a', null, '⚡ Viết lại hook'); a2.href = 'hook-text.html';
  const lamLai = tao('button', null, '↺ Làm lại cho video mới'); lamLai.type = 'button';
  lamLai.addEventListener('click', () => { daTick = new Set(); ls.del(KEY); di(0); });
  nut.append(a1, a2, lamLai);

  const nguon = tao('p', 'nguon', 'Nguồn: ');
  const n1 = tao('a', null, 'TikTok – How TikTok recommends videos'); n1.href = 'https://newsroom.tiktok.com/en-us/how-tiktok-recommends-videos-for-you/';
  const n2 = tao('a', null, 'Meta – Supporting original content (3/2026)'); n2.href = 'https://creators.facebook.com/blog/supporting-original-content-on-facebook';
  [n1, n2].forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  nguon.append(n1, ' · ', n2);

  the.append(cb, nut, nguon);
  return the;
}

function ve() {
  buoc = buocTuHash();
  veThanhBuoc();
  const man = $('#man');
  man.replaceChildren(buoc < KET ? veNhom(NHOM[buoc], buoc) : veKetQua());
  $('#lui').disabled = buoc === 0;
  $('#tiep').hidden = buoc === KET;
  $('#tiep').textContent = buoc === KET - 1 ? 'Xem kết quả →' : 'Tiếp →';
  window.scrollTo(0, 0);
  const h = man.querySelector('h2');
  if (h && document.activeElement && document.activeElement !== document.body) h.focus({ preventScroll: true });
}

$('#man').addEventListener('change', e => {
  const id = e.target.dataset && e.target.dataset.id;
  if (!id) return;
  daTick = new Set(daTick);
  if (e.target.checked) daTick.add(id); else daTick.delete(id);
  ls.set(KEY, JSON.stringify([...daTick]));
  const n = NHOM[buoc];
  const so = $('#man .so span:last-child');
  const ids = idsNhom(n);
  so.textContent = ids.filter(x => daTick.has(x)).length + '/' + ids.length + ' đã tick';
  so.className = xongNhom(n) ? 'xong' : '';
  veThanhBuoc();
  // tick đủ nhóm thì tự sang bước sau, chờ một nhịp để thấy dấu tick
  if (e.target.checked && xongNhom(n)) {
    const tu = buoc;
    setTimeout(() => { if (buoc === tu && xongNhom(n)) di(tu + 1); }, 450);
  }
});
$('#lui').addEventListener('click', () => { if (buoc > 0) di(buoc - 1); });
$('#tiep').addEventListener('click', () => { if (buoc < KET) di(buoc + 1); });
window.addEventListener('hashchange', ve);

function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
applyTheme(ls.get('hook.theme'));
$('#themeBtn').addEventListener('click', () => { const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; const t = dark ? 'light' : 'dark'; applyTheme(t); ls.set('hook.theme', t); });

ve();
</script>
</body>
</html>
