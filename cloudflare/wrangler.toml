# Cấu hình để cài máy chủ bằng cách nối GitHub (Workers & Pages → Create → Import a repository → chọn repo này,
# Root directory: cloudflare) hoặc bằng lệnh: npx wrangler deploy (trong thư mục cloudflare).
# Key vẫn thêm trên trang Cloudflare: Settings → Variables and Secrets (GEMINI_API_KEYS, PEXELS_KEY, APPS_SCRIPT_URL…).
name = "flat-wave-6907"   # trùng tên Worker trên Cloudflare để bản build từ GitHub cập nhật đúng Worker này
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
# giữ các biến Text đặt trên trang Cloudflare (APPS_SCRIPT_URL, LLM_PROVIDER…) khi build từ GitHub, không xoá
keep_vars = true
