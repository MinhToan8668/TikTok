# Mỗi ngày kiểm tra bản phát hành mới của heygen-com/hyperframes; có thay đổi thì chép skill mới vào
# .claude/skills và commit thẳng lên main. Chạy tay: tab Actions → "Cập nhật skill HyperFrames" → Run workflow.
name: Cập nhật skill HyperFrames

on:
  schedule:
    - cron: "17 20 * * *" # 03:17 sáng giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cap-nhat-hyperframes
  cancel-in-progress: false

jobs:
  dong-bo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Chép skill từ bản phát hành mới nhất
        id: dongbo
        run: |
          TAG=$(.github/scripts/cap-nhat-hyperframes.sh)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Commit nếu có thay đổi
        run: |
          if [ -z "$(git status --porcelain -- .claude/skills docs/hyperframes.md)" ]; then
            echo "Skill HyperFrames đã là bản mới nhất (${{ steps.dongbo.outputs.tag }})."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .claude/skills docs/hyperframes.md
          git commit -m "Skill HyperFrames lên bản ${{ steps.dongbo.outputs.tag }}"
          git push origin HEAD:main
